[package]
name = "wutheringwaves-download-manager"
version = "0.3.0"
description = "鸣潮 (Wuthering Waves) 下载管理器"
authors = ["liangzhaoyuan12"]
edition = "2021"
license = "MIT"

[lib]
name = "wutheringwaves_download_manager_gui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["gzip", "stream", "json"] }
tokio = { version = "1", features = ["full"] }
md5 = "0.7"
url = "2"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
futures-util = "0.3"
walkdir = "2"
regex = "1"
